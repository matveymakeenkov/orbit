<style>
  * { box-sizing:border-box; }

  header { position:relative; z-index:50; padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; background:rgba(12,15,23,.92); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,.06); }
  h1 { margin:0 0 4px; font-size:22px; font-weight:900; } h1 span { color:#ffae2b; }
  .desc { color:#8b93ab; font-size:13.5px; margin:0 0 10px; min-height:36px; line-height:1.35; }
  .tabs { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; border:0; border-radius:20px; padding:9px 14px; font:700 14px -apple-system,system-ui,sans-serif; background:#1a2033; color:#cdd3e6; cursor:pointer; }
  .tab.on { background:#ffae2b; color:#1a1200; }
  .tab.link { background:transparent; border:1px solid #2a3150; color:#8b93ab; text-decoration:none; display:inline-flex; align-items:center; }
  #tilt { margin-top:10px; font:700 13px -apple-system,system-ui,sans-serif; color:#0c0f17; background:#38d1ff; border:0; border-radius:10px; padding:9px 14px; display:none; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:26px 18px; padding:22px 18px calc(env(safe-area-inset-bottom) + 40px); max-width:1100px; margin:0 auto; justify-items:center; }
  footer { color:#5d6580; font-size:12px; text-align:center; padding:0 20px 40px; }

  /* ---------- shared card mechanics ---------- */
  .card { --mx:.5; --my:.5; --rx:0deg; --ry:0deg; --rc:#9aa3b5; width:290px; aspect-ratio:63/88; perspective:900px; cursor:pointer; touch-action:pan-y; }
  .inner { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.8,.2,1); transform:rotateX(var(--rx)) rotateY(var(--ry)); }
  .card.flipped .inner { transform:rotateX(var(--rx)) rotateY(calc(180deg + var(--ry))); }
  .face { position:absolute; inset:0; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 18px 40px rgba(0,0,0,.55); }
  .back { transform:rotateY(180deg); }
  .ph { position:absolute; inset:0; overflow:hidden; }
  .ph img, .ph svg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ph img { opacity:0; transition:opacity .5s; } .ph img.ok { opacity:1; }
  .fx, .glare { position:absolute; inset:0; pointer-events:none; z-index:20; }
  .glare { background:radial-gradient(circle at calc(var(--mx)*100%) calc(var(--my)*100%), rgba(255,255,255,.22), transparent 42%); mix-blend-mode:overlay; }
  .r-common { --rc:#9aa3b5; } .r-uncommon { --rc:#3fc46e; } .r-rare { --rc:#3d8bff; } .r-epic { --rc:#a855ff; } .r-legend { --rc:#ff9f1a; } .r-unique { --rc:#ff3d63; }

  /* lamination overlays (style-independent) */
  .l-gloss .fx { background:radial-gradient(circle at calc(var(--mx)*100%) calc(var(--my)*100%), rgba(255,255,255,.55), transparent 38%); mix-blend-mode:soft-light; }
  .l-holo .fx, .l-num .fx { background:repeating-linear-gradient(115deg,#ff2d95 0%,#ffcf3a 6%,#3dffb0 12%,#38c8ff 18%,#9a4dff 24%,#ff2d95 30%);
    background-size:400% 400%; background-position:calc(var(--mx)*100%) calc(var(--my)*100%); mix-blend-mode:color-dodge; opacity:.38; }
  .l-chrome .fx { background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.85) 32%,transparent 42%,transparent 58%,rgba(255,255,255,.6) 66%,transparent 76%);
    background-size:300% 300%; background-position:calc(var(--mx)*100%) calc(var(--my)*100%); mix-blend-mode:overlay; }
  .l-chrome .face { outline:4px solid #c9ced9; outline-offset:-4px; }
  .l-gold .fx { background:radial-gradient(circle at calc(var(--mx)*100%) calc(var(--my)*100%), rgba(255,236,150,.75), transparent 36%),
      repeating-radial-gradient(circle at 70% 20%, rgba(255,215,90,.5) 0 1px, transparent 1px 5px); mix-blend-mode:overlay; }
  .l-gold .face { outline:4px solid #e3b23c; outline-offset:-4px; }
  .l-carbon .fx { background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 3px,transparent 3px 6px),repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 3px,transparent 3px 6px),
      linear-gradient(115deg,transparent 30%,rgba(255,255,255,.3) 45%,transparent 58%); background-size:auto,auto,300% 300%;
    background-position:0 0,0 0,calc(var(--mx)*100%) calc(var(--my)*100%); mix-blend-mode:overlay; }
  .l-carbon .face { outline:4px solid #26292f; outline-offset:-4px; }
  .l-retro .ph img, .l-retro .ph svg { filter:sepia(.9) contrast(1.05) brightness(.92); }
  .l-retro .fx { background:repeating-radial-gradient(circle at 20% 30%, rgba(120,80,20,.12) 0 1px, transparent 1px 4px), radial-gradient(ellipse at center, transparent 55%, rgba(90,55,10,.45)); mix-blend-mode:multiply; }
  .l-matte .ph img { filter:saturate(.8) contrast(.95); } .l-matte .glare { opacity:.3; }
  .stamp { position:absolute; z-index:25; transform:rotate(-8deg); font:900 12px -apple-system,system-ui,sans-serif; letter-spacing:1px; padding:4px 8px; border-radius:6px; color:#fff;
    background:linear-gradient(135deg,#ff2d95,#ffcf3a,#3dffb0,#38c8ff,#9a4dff); box-shadow:0 2px 10px rgba(0,0,0,.5); }

  /* ================= STYLE 1: ЧЕРТЁЖ ================= */
  .s-bp .face { border-radius:6px; background:#0f3f80;
    background-image:linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px),
      linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
    background-size:58px 58px,58px 58px,11.6px 11.6px,11.6px 11.6px; color:#eaf3ff; font-family:"SF Mono",Menlo,Consolas,monospace; }
  .s-bp .bd { position:absolute; inset:8px; border:1.5px solid rgba(234,243,255,.85); }
  .s-bp .hd { position:absolute; left:16px; right:16px; top:15px; display:flex; justify-content:space-between; font-size:10px; letter-spacing:1px; opacity:.85; }
  .s-bp .phw { position:absolute; left:16px; right:16px; top:34px; height:40%; border:1px solid rgba(234,243,255,.6); }
  .s-bp .ph { background:#0f3f80; }
  .s-bp .ph img { filter:grayscale(1) contrast(1.25) brightness(1.15); mix-blend-mode:screen; }
  .s-bp .phw::before, .s-bp .phw::after { content:""; position:absolute; width:12px; height:12px; border:2px solid #eaf3ff; z-index:3; }
  .s-bp .phw::before { left:-5px; top:-5px; border-right:0; border-bottom:0; } .s-bp .phw::after { right:-5px; bottom:-5px; border-left:0; border-top:0; }
  .s-bp .dim { position:absolute; left:16px; right:16px; top:calc(34px + 40% + 6px); height:12px; border-left:1px solid #eaf3ff; border-right:1px solid #eaf3ff; }
  .s-bp .dim::before { content:""; position:absolute; left:0; right:0; top:6px; border-top:1px solid #eaf3ff; }
  .s-bp .dim span { position:absolute; left:50%; top:0; transform:translateX(-50%); background:#0f3f80; padding:0 6px; font-size:9.5px; letter-spacing:1px; }
  .s-bp .nm { position:absolute; left:16px; right:16px; top:calc(34px + 40% + 24px); font:800 17px -apple-system,system-ui,sans-serif; letter-spacing:.3px; line-height:1.15; text-transform:uppercase; }
  .s-bp .tb { position:absolute; left:16px; right:16px; bottom:16px; font-size:11px; }
  .s-bp .row { display:flex; gap:4px; padding:3px 0; border-bottom:1px dashed rgba(234,243,255,.3); }
  .s-bp .row span:first-child { opacity:.7; } .s-bp .row i { flex:1; border-bottom:1px dotted rgba(234,243,255,.35); margin-bottom:4px; }
  .s-bp .seal { position:absolute; right:18px; top:calc(34px + 40% - 52px); width:74px; height:74px; border-radius:50%; border:2.5px solid var(--rc); color:var(--rc);
    display:flex; align-items:center; justify-content:center; text-align:center; font:900 9px -apple-system,system-ui,sans-serif; letter-spacing:.6px; transform:rotate(-14deg);
    background:rgba(15,63,128,.75); z-index:5; box-shadow:inset 0 0 0 3px rgba(15,63,128,.9), inset 0 0 0 4.5px var(--rc); }
  .s-bp.r-unique .seal { animation:hue 3s linear infinite; } @keyframes hue { to { filter:hue-rotate(360deg); } }
  .s-bp .stamp { right:18px; top:36px; }
  .s-bp .back .txt { position:absolute; inset:22px 20px; font-size:12px; line-height:1.55; }
  .s-bp .back h3 { font:800 15px -apple-system,system-ui,sans-serif; text-transform:uppercase; margin:6px 0 10px; }

  /* ================= STYLE 2: ГОНКА ================= */
  .s-race .face { border-radius:14px; background:#f4f4f2; color:#111; font-family:-apple-system,system-ui,sans-serif; }
  .s-race .ph { clip-path:polygon(0 0,100% 0,100% 82%,0 100%); height:52%; bottom:auto; background:#2a3352; }
  .s-race .ph svg { height:88%; }
  .s-race .liv { position:absolute; left:-20%; right:-20%; top:46%; height:46px; transform:rotate(-8deg); background:var(--rc); z-index:3; box-shadow:0 10px 0 #111, 0 20px 0 #f4f4f2, 0 26px 0 var(--rc); }
  .s-race .num { position:absolute; left:12px; top:12px; width:58px; height:58px; border-radius:50%; background:#fff; border:4px solid #111; z-index:6;

  .s-race .yr { position:absolute; right:12px; top:14px; z-index:6; font:900 italic 15px -apple-system,system-ui,sans-serif; color:#fff; background:#111; padding:4px 9px; border-radius:6px; transform:skewX(-10deg); }
  .s-race .rt { position:absolute; left:14px; top:calc(46% + 13px); z-index:6; color:#fff; font:900 italic 12px -apple-system,system-ui,sans-serif; letter-spacing:1.5px; transform:rotate(-8deg); text-transform:uppercase; text-shadow:0 1px 0 rgba(0,0,0,.3); }
  .s-race .nm { position:absolute; left:14px; right:14px; top:64%; z-index:6; font:900 italic 21px -apple-system,system-ui,sans-serif; line-height:1; text-transform:uppercase; letter-spacing:-.3px; }
  .s-race .mk { font:700 11px -apple-system,system-ui,sans-serif; color:#666; text-transform:uppercase; letter-spacing:1px; margin-top:4px; font-style:normal; }
  .s-race .bars { position:absolute; left:14px; right:14px; bottom:24px; z-index:6; font:800 10px -apple-system,system-ui,sans-serif; }
  .s-race .br { display:grid; grid-template-columns:62px 1fr 64px; align-items:center; gap:6px; margin-top:4px; }
  .s-race .br span:first-child { color:#666; letter-spacing:.8px; }
  .s-race .tr { height:8px; background:#ddd; border-radius:2px; overflow:hidden; transform:skewX(-20deg); }
  .s-race .tr i { display:block; height:100%; background:var(--rc); }
  .s-race .br b { text-align:right; font-size:11px; }
  .s-race .chk { position:absolute; left:0; right:0; bottom:0; height:12px; z-index:6; background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/12px 12px; }

  .s-race .back .txt { position:absolute; inset:20px 18px 26px; font-size:13px; line-height:1.5; z-index:6; }

  /* ================= STYLE 3: ВКЛАДЫШ 90-х ================= */

  .s-ins .win { position:absolute; inset:10px; border-radius:6px; overflow:hidden; background:#fff; }

  .s-ins .dots { position:absolute; inset:0; bottom:30%; background:radial-gradient(rgba(0,0,0,.12) 1px, transparent 1.4px) 0 0/4px 4px; mix-blend-mode:multiply; z-index:2; }
  .s-ins .nb { position:absolute; left:8px; top:8px; z-index:5; width:62px; height:62px; border-radius:50%; background:#ffe600; border:3px solid #e3262b;
    display:flex; align-items:center; justify-content:center; font:900 22px "Arial Black",Impact,-apple-system,sans-serif; color:#e3262b; box-shadow:2px 3px 0 rgba(0,0,0,.35); }
  .s-ins .bn { position:absolute; left:0; right:0; bottom:0; height:30%; background:linear-gradient(180deg,#e3262b,#b3121a); color:#fff; padding:10px 12px; z-index:4; }
  .s-ins .bn::before { content:""; position:absolute; left:0; right:0; top:-10px; height:10px; background:linear-gradient(180deg,transparent,rgba(0,0,0,.25)); }
  .s-ins .nm { font:900 italic 21px "Arial Black",Impact,-apple-system,sans-serif; line-height:1.02; text-transform:uppercase; letter-spacing:-.5px; text-shadow:2px 2px 0 rgba(0,0,0,.35); }
  .s-ins .ln { margin-top:6px; font:800 12px -apple-system,system-ui,sans-serif; display:flex; justify-content:space-between; color:#ffe9a8; }
  .s-ins .stars { position:absolute; right:10px; top:10px; z-index:5; color:#ffe600; font-size:17px; letter-spacing:1px; text-shadow:0 0 3px #000, 1px 1px 0 #000; }
  .s-ins .stamp { right:10px; bottom:calc(30% + 10px); }
  .s-ins .back .win { background:#ffe600; }
  .s-ins .back .txt { position:absolute; inset:16px 16px; color:#2a1400; font-size:13px; line-height:1.48; }
  .s-ins .back h3 { font:900 italic 18px "Arial Black",Impact,-apple-system,sans-serif; text-transform:uppercase; color:#e3262b; margin:4px 0 8px; }
  .s-ins .back .tbl { margin-top:10px; font-weight:800; font-size:12px; }
  .s-ins .back .tbl div { display:flex; justify-content:space-between; border-bottom:2px dotted rgba(0,0,0,.25); padding:3px 0; }

  .credit { font-size:10px; line-height:1.4; opacity:.75; margin-top:12px; word-break:break-word; }
  .credit a { color:inherit; }
</style>

  mid:'M10 58 L12 50 L60 44 L86 30 L124 30 L152 42 L190 48 L190 58 Z', hyper:'M8 58 L12 48 L56 44 L84 30 L128 30 L160 42 L192 48 L192 58 Z',
};
const WHEELS = { veteran3:[[48,54,9],[146,54,9]], veteran:[[46,56,11],[150,56,11]] };
function silhouette(c, mode) {
  const w = WHEELS[c.body] || [[50,58,11],[150,58,11]];
  if (mode === 'line') {
    return `<svg viewBox="0 0 200 80" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#eaf3ff" stroke-width="1.2">
      <path d="${BODY[c.body]}"/>${w.map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}"/><circle cx="${x}" cy="${y}" r="${r*.4}"/>`).join('')}
      <line x1="0" y1="${w[0][1]+w[0][2]}" x2="200" y2="${w[0][1]+w[0][2]}" stroke-dasharray="4 3" opacity=".6"/></g></svg>`;
  }
  const sky = mode === 'sky';
  return `<svg viewBox="-25 -38 250 120" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
    ${sky ? '<rect x="-400" y="68" width="1000" height="200" fill="#8f9399"/>' : `<rect x="-400" y="-300" width="1000" height="368" fill="#2a3352"/><rect x="-400" y="68" width="1000" height="200" fill="#141a2b"/>`}
    <path d="${BODY[c.body]}" fill="${c.color}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
    ${w.map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#0b0d12"/><circle cx="${x}" cy="${y}" r="${r*.45}" fill="#9aa1b0"/>`).join('')}</svg>`;
}
const photoCache = {};
function getPhoto(c) {
  if (photoCache[c.wiki]) return photoCache[c.wiki];
  photoCache[c.wiki] = (async () => {
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(c.wiki) + '?redirect=true');
    if (!r.ok) throw 0;
    const j = await r.json(); let src = j.thumbnail && j.thumbnail.source;
    if (!src || src.includes('/wikipedia/en/')) throw 0;
    const big = src.replace(/\/(\d+)px-/, '/800px-');
    const m = src.match(/\/commons\/thumb\/[0-9a-f]\/[0-9a-f]{2}\/([^/]+)\//);
    let credit = 'Фото: Wikimedia Commons';
    if (m) {
      const file = decodeURIComponent(m[1]), page = 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(file);
      credit = 'Фото: <a href="' + page + '" target="_blank" rel="noopener">Wikimedia Commons</a>';
      try {
        const q = await (await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=extmetadata&titles=File:' + encodeURIComponent(file))).json();
        const md = Object.values(q.query.pages)[0].imageinfo[0].extmetadata, strip = s => (s || '').replace(/<[^>]*>/g, '').trim().slice(0, 70);
        credit = 'Фото: ' + (strip(md.Artist && md.Artist.value) || 'автор не указан') + ', ' + strip(md.LicenseShortName && md.LicenseShortName.value) + ' · <a href="' + page + '" target="_blank" rel="noopener">Commons</a>';
      } catch (e) {}
    }
    return { big, small: src, credit };
  })();
  photoCache[c.wiki].catch(() => {});
  return photoCache[c.wiki];
}
const fmt = v => v == null ? '—' : String(v).replace('.', ',');
const hpTxt = c => fmt(c.hp) + ' л.с.', topTxt = c => fmt(c.top) + ' км/ч', accTxt = c => c.acc == null ? '—' : fmt(c.acc) + ' с', massTxt = c => c.mass == null ? '—' : c.mass + ' кг';

function tplBp(c) {
  return `<div class="face front"><div class="bd"></div>
    <div class="hd"><span>ЛИСТ ${c.n} · ${c.country.toUpperCase()}</span><span>${c.year}</span></div>
    <div class="phw"><div class="ph">${silhouette(c, 'line')}<img alt=""></div></div>
    <div class="seal"><div>${RAR[c.rar].toUpperCase()}<br>★ ${c.year} ★</div></div>
    <div class="dim"><span>${c.maker.toUpperCase()}</span></div>
    <div class="nm">${c.name}</div>
    <div class="tb">
      <div class="row"><span>МОЩНОСТЬ</span><i></i><b>${hpTxt(c)}</b></div>
      <div class="row"><span>МАКС. СКОРОСТЬ</span><i></i><b>${topTxt(c)}</b></div>
      <div class="row"><span>0–100 КМ/Ч</span><i></i><b>${accTxt(c)}</b></div>
      <div class="row"><span>МАССА</span><i></i><b>${massTxt(c)}</b></div>
      <div class="row"><span>ТИРАЖ</span><i></i><b>${c.prod}</b></div>
      <div class="row" style="border:0"><span>ЛАМИН.</span><i></i><b>${LAM[c.lam].toUpperCase()}</b></div>
    </div>${c.serial ? `<div class="stamp">${c.serial}</div>` : ''}<div class="fx"></div><div class="glare"></div></div>
  <div class="face back"><div class="bd"></div><div class="txt"><div style="opacity:.7;font-size:10px">ЛИСТ ${c.n} · ПОЯСНИТЕЛЬНАЯ ЗАПИСКА</div>
    <h3>${c.name}</h3><div>${c.fact}</div><div class="credit">Фото не загрузилось — показан чертёж.</div></div><div class="fx"></div></div>`;
}
function bar(v) { return `<span class="tr"><i style="width:${Math.max(3, Math.min(100, v * 100))}%"></i></span>`; }
function tplRace(c) {
  const p = Math.log10(c.hp + 1) / Math.log10(1501), s = c.top / 420, a = c.acc == null ? 0 : 1 - (c.acc - 2) / 34;
  return `<div class="face front"><div class="ph">${silhouette(c)}<img alt=""></div>
    <div class="liv"></div><div class="num">${c.n}</div><div class="yr">${c.year}</div><div class="rt">${RAR[c.rar]} · ${c.country}</div>
    <div class="nm">${c.name}<div class="mk">${c.maker} · ${LAM[c.lam]}</div></div>
    <div class="bars">
      <div class="br"><span>МОЩНОСТЬ</span>${bar(p)}<b>${hpTxt(c)}</b></div>
      <div class="br"><span>СКОРОСТЬ</span>${bar(s)}<b>${topTxt(c)}</b></div>
      <div class="br"><span>РАЗГОН</span>${bar(a)}<b>${accTxt(c)}</b></div>
    </div><div class="chk"></div>${c.serial ? `<div class="stamp">${c.serial}</div>` : ''}<div class="fx"></div><div class="glare"></div></div>
  <div class="face back"><div class="liv"></div><div class="chk"></div><div class="txt"><div style="font-weight:800;color:#666;font-size:11px;letter-spacing:1px">#${c.n} · ${c.year} · ${c.country.toUpperCase()}</div>
    <h3>${c.name}</h3><div>${c.fact}</div><div style="margin-top:8px;font-weight:700">Тираж: ${c.prod} · Масса: ${massTxt(c)}</div><div class="credit">Фото не загрузилось — показан рисунок.</div></div><div class="fx"></div></div>`;
}
function tplIns(c) {
  return `<div class="face front"><div class="win"><div class="ph">${silhouette(c, 'sky')}<img alt=""></div><div class="dots"></div>
    <div class="nb">${c.n}</div><div class="stars">${STARS[c.rar]}</div>
    <div class="bn"><div class="nm">${c.name}</div><div class="ln"><span>${hpTxt(c)}</span><span>${topTxt(c)}</span><span>${c.year}</span></div></div>
    ${c.serial ? `<div class="stamp">${c.serial}</div>` : ''}</div><div class="fx"></div><div class="glare"></div></div>
  <div class="face back"><div class="win"><div class="txt"><div style="font-weight:900">№ ${c.n} · ${RAR[c.rar].toUpperCase()} · ${LAM[c.lam].toUpperCase()}</div>
    <h3>${c.name}</h3><div>${c.fact}</div>
    <div class="tbl"><div><span>Страна</span><span>${c.country}</span></div><div><span>0–100 км/ч</span><span>${accTxt(c)}</span></div><div><span>Масса</span><span>${massTxt(c)}</span></div><div><span>Тираж</span><span>${c.prod}</span></div></div>
    <div class="credit">Фото не загрузилось — показан рисунок.</div></div></div><div class="fx"></div></div>`;
}
const TPL = { bp: tplBp, race: tplRace, ins: tplIns };

const grid = document.getElementById('grid');
let style = (location.hash || '').slice(1); if (!TPL[style]) style = 'bp';
function render() {
  document.getElementById('desc').textContent = DESC[style];
  for (const t of document.querySelectorAll('.tab[data-s]')) t.classList.toggle('on', t.dataset.s === style);
  grid.innerHTML = '';
  for (const c of CARS) {
    const el = document.createElement('div');
    el.className = 'card s-' + style + ' r-' + c.rar + ' l-' + c.lam;
    el.innerHTML = '<div class="inner">' + TPL[style](c) + '</div>';
    grid.appendChild(el);
    const img = el.querySelector('img'), credit = el.querySelector('.credit');
    getPhoto(c).then(ph => { img.onload = () => img.classList.add('ok'); img.onerror = () => { if (img.src !== ph.small) img.src = ph.small; }; img.src = ph.big; credit.innerHTML = ph.credit; }).catch(() => {});
    const set = (mx, my) => { el.style.setProperty('--mx', mx.toFixed(3)); el.style.setProperty('--my', my.toFixed(3));
      el.style.setProperty('--ry', ((mx - .5) * 18).toFixed(2) + 'deg'); el.style.setProperty('--rx', ((.5 - my) * 14).toFixed(2) + 'deg'); };
    el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); set((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); el.dataset.p = '1'; });
    el.addEventListener('pointerleave', () => { delete el.dataset.p; set(.5, .5); });
    el.addEventListener('click', e => { if (e.target.closest('a')) return; el.classList.toggle('flipped'); });
  }
}
for (const t of document.querySelectorAll('.tab[data-s]')) t.addEventListener('click', () => { style = t.dataset.s; history.replaceState(null, '', '#' + style); render(); window.scrollTo({ top: 0 }); });
window.addEventListener('hashchange', () => { const s = location.hash.slice(1); if (TPL[s] && s !== style) { style = s; render(); } });
render();

const btn = document.getElementById('tilt');
function onOrient(e) {
  const g = Math.max(-35, Math.min(35, e.gamma || 0)), b = Math.max(10, Math.min(80, e.beta || 45)), mx = (g + 35) / 70, my = (b - 10) / 70;
  for (const el of grid.children) { if (el.dataset.p) continue;
    el.style.setProperty('--mx', mx.toFixed(3)); el.style.setProperty('--my', my.toFixed(3));
    el.style.setProperty('--ry', ((mx - .5) * 16).toFixed(2) + 'deg'); el.style.setProperty('--rx', ((.5 - my) * 10).toFixed(2) + 'deg'); }
}
if (window.DeviceOrientationEvent) {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    btn.style.display = 'inline-block';
    btn.addEventListener('click', async () => { try { if (await DeviceOrientationEvent.requestPermission() === 'granted') { window.addEventListener('deviceorientation', onOrient); btn.style.display = 'none'; } } catch (e) { btn.textContent = 'Наклон недоступен — водите пальцем'; } });
  } else window.addEventListener('deviceorientation', onOrient);
}
})();
</script>
</body>
</html>
