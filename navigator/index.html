<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Навигатор</title>
<style>
  html,body{margin:0;height:100%;background:#0e1320;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;

  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #safe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
  #snd{position:fixed;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 8px);
    width:40px;height:40px;border-radius:20px;border:1px solid rgba(160,180,255,.22);background:rgba(30,38,60,.75);
    color:#cfd8ff;font-size:18px;line-height:38px;text-align:center;padding:0;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="snd" aria-label="Звук">🔊</button>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const safeEl = document.getElementById('safe'), sndBtn = document.getElementById('snd');
const TAU = Math.PI * 2, DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const FONT = '-apple-system,BlinkMacSystemFont,system-ui,sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmtMoney = n => Math.round(n).toLocaleString('ru-RU');

// ---------------- content ----------------
const STAGES = [
  { c: 4, r: 5, cut: 0.18, ow: 0,    closures: false, fickle: 0,    name: 'Спальный район', hint: 'Свайп ← налево, → направо, ↑ прямо, ↓ разворот. Или кнопки внизу. Команда срабатывает на ближайшем перекрёстке.' },
  { c: 5, r: 6, cut: 0.2,  ow: 0.18, closures: false, fickle: 0,    name: 'Центр',          hint: 'Появились односторонние улицы — смотрите на стрелки. Поедете против — штраф.' },
  { c: 5, r: 7, cut: 0.22, ow: 0.2,  closures: true,  fickle: 0,    name: 'Промзона',       hint: 'Дорожные работы! Улицы перекрывают прямо по ходу. Водитель упрётся и развернётся.' },
  { c: 6, r: 8, cut: 0.22, ow: 0.24, closures: true,  fickle: 0.35, name: 'Старый город',   hint: 'Пассажиры могут передумать, куда ехать. Следите за меткой.' },
  { c: 6, r: 9, cut: 0.24, ow: 0.27, closures: true,  fickle: 0.4,  name: 'Набережная',     hint: 'Улицы запутаннее, водитель быстрее.' },
  { c: 7, r: 10, cut: 0.25, ow: 0.3, closures: true,  fickle: 0.45, name: 'Мегаполис',      hint: 'Самый сложный район. Удачи, штурман!' },
];
const STREETS_H = ['Садовая', 'Ленина', 'Мира', 'Гагарина', 'Школьная', 'Советская', 'Пушкина', 'Лесная', 'Победы', 'Кирова', 'Чехова', 'Заречная'];
const STREETS_V = ['Цветочная', 'Новая', 'Полевая', 'Речная', 'Строителей', 'Молодёжная', 'Солнечная', 'Вокзальная', 'Зелёная', 'Липовая'];
const PASSENGERS = ['👵', '👨‍💼', '👩‍🎓', '🧑‍🍳', '👨‍🔧', '👩‍⚕️', '🧔', '👱‍♀️', '👨‍🎤', '🧑‍💻', '🤵', '👩‍🎨'];
const DRIVER = '🚕', RADIO = '📻', NAVI = '🧭';
const GREET = ['Добрый день! Мне на {a}.', 'Шеф, на {a}, побыстрее!', 'Здрасьте. {a}, пожалуйста.', 'Мне на {a}, опаздываю на работу!', 'До {a}. Только без приключений.', 'На {a}! И музыку погромче.', 'Мне на {a}. Навигатору доверяете?'];
const CHANGE = ['Ой, стойте! Мне же на {a}!', 'Подождите, планы поменялись. Едем на {a}.', 'Подруга написала — давайте на {a}!', 'Ой, я адрес перепутал. {a}!'];
const THANKS = ['Спасибо, доехали.', 'Ну наконец-то.', 'Спасибо. Навигатор у вас странный.', 'Доехали, и ладно.'];
const THANKS_FAST = ['Быстро домчали! Держите на чай.', 'Вот это скорость! Чаевые ваши.', 'Отлично, успел! Спасибо!'];
const L_DEAD = ['Тупик. Разворачиваюсь…', 'Ну и куда ты меня завёл? Тупик!', 'Тупик! Штурман, ау?'];
const L_BARRIER = ['Перекрыто! Разворачиваюсь.', 'Ремонт! Что ж ты не предупредил…', 'Тут раскопали всё. Разворот.'];
const L_WRONG = ['Тут же одностороннее! Ну ты сказал — я поехал.', 'Под кирпич?! Ладно, ты штурман…', 'Против движения! Это штраф!'];
const L_INVALID = ['{d} там нет дороги, еду прямо.', 'Куда {d}? Там дома стоят!', '{d}? Там нет поворота.'];
const L_WAIT = ['Куда дальше? Налево или направо?', 'Развилка. Куда сворачиваем?', 'Стою. Жду команду.'];
const L_LATE = ['Поздно! Проехали. Сверну на следующем.', 'Раньше надо говорить! Проехали.', 'Эх, проскочили поворот…'];
const L_OK = ['Понял.', 'Есть!', 'Поехали.'];
const L_UTURN = ['Разворачиваюсь.', 'Разворот, понял.'];
const DIR_WORD = { L: 'Налево', R: 'Направо', S: 'Прямо', U: 'Назад' };
const CMD_TXT = { L: 'поверните налево', R: 'поверните направо', S: 'двигайтесь прямо', U: 'развернитесь' };
const fill = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k]);

// ---------------- storage ----------------
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

// ---------------- sound + voice ----------------
let ac = null, muted = load('nav_mute') === '1';
function unlock() {
  try {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  } catch (e) { ac = null; }
}
function tone(f, d, type, v, f2, delay) {
  if (!ac || muted) return;
  try {
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v || 0.1, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.03);
  } catch (e) {}
}
const sfxCmd = () => { tone(880, 0.08, 'sine', 0.08); tone(1320, 0.1, 'sine', 0.07, 0, 0.07); };
const sfxCancel = () => tone(500, 0.1, 'triangle', 0.07, 300);
const sfxBad = () => tone(180, 0.25, 'square', 0.05, 120);
const sfxAsk = () => { tone(660, 0.1, 'triangle', 0.07); tone(660, 0.1, 'triangle', 0.07, 0, 0.16); };
const sfxCoin = () => { [988, 1319, 1760].forEach((f, i) => tone(f, 0.16, 'sine', 0.09, 0, i * 0.07)); };
const sfxSiren = () => { for (let i = 0; i < 4; i++) tone(i % 2 ? 620 : 900, 0.18, 'sawtooth', 0.04, 0, i * 0.18); };
const sfxRadio = () => { tone(1200, 0.05, 'square', 0.03); tone(900, 0.05, 'square', 0.03, 0, 0.06); };
const sfxDoor = () => { tone(740, 0.12, 'sine', 0.08); tone(587, 0.18, 'sine', 0.08, 0, 0.12); };

let ruVoice = null;
function loadVoices() { try { const vs = window.speechSynthesis.getVoices(); ruVoice = vs.find(v => /^ru/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { loadVoices(); try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function speak(s) {
  if (muted || !ruVoice) return;
  try { const ss = window.speechSynthesis; ss.cancel(); const u = new SpeechSynthesisUtterance(s); u.voice = ruVoice; u.lang = ruVoice.lang; u.rate = 1.15; ss.speak(u); } catch (e) {}
}
function setSndIcon() { sndBtn.textContent = muted ? '🔇' : '🔊'; }
setSndIcon();
sndBtn.addEventListener('pointerdown', e => e.stopPropagation());
sndBtn.addEventListener('click', e => {
  e.stopPropagation(); unlock(); muted = !muted; save('nav_mute', muted ? 1 : 0); setSndIcon();
  if (muted) { try { window.speechSynthesis.cancel(); } catch (er) {} } else sfxCmd();
});

// ---------------- layout ----------------
let W = 0, H = 0, SAFE_T = 0, SAFE_B = 0, L = 40, RW = 12, ox = 0, oy = 0, topH = 0, botH = 0;
let C = 4, Rr = 5, edges = new Map(), cells = [], rowNames = [], colNames = [];
function readSafe() { const cs = getComputedStyle(safeEl); SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0; }
function layout() {
  topH = SAFE_T + 122; botH = SAFE_B + 142;
  const mapTop = topH + 12, mapBot = H - botH - 12, aw = W - 24, ah = mapBot - mapTop;
  L = Math.max(16, Math.min(aw / (C - 1 + 0.9), ah / (Rr - 1 + 0.9), 110));
  RW = L * 0.3;
  ox = W / 2 - (C - 1) * L / 2; oy = (mapTop + mapBot) / 2 - (Rr - 1) * L / 2;
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  readSafe(); layout();
}
const sx = x => ox + x * L, sy = y => oy + y * L;

// ---------------- graph ----------------
function addEdge(h, i, j) { const k = (h ? 'h' : 'v') + i + ',' + j; edges.set(k, { k, h, i, j, ow: 0, closed: false, closedAt: 0 }); }
function ekey(i, j, d) {
  if (d === 0) return j > 0 ? 'v' + i + ',' + (j - 1) : null;
  if (d === 1) return i < C - 1 ? 'h' + i + ',' + j : null;
  if (d === 2) return j < Rr - 1 ? 'v' + i + ',' + j : null;
  return i > 0 ? 'h' + (i - 1) + ',' + j : null;
}
function edgeAt(i, j, d) { const k = ekey(i, j, d); return k ? (edges.get(k) || null) : null; }
const sgn = d => (d === 1 || d === 2) ? 1 : -1;
const wrongWay = (e, d) => e.ow !== 0 && e.ow !== sgn(d);
function canTravel(i, j, d) { const e = edgeAt(i, j, d); return !!e && !e.closed && !wrongWay(e, d); }
function bfsAll(mode) {
  const N = C * Rr, seen = new Uint8Array(N), q = [0]; seen[0] = 1; let c = 1;
  while (q.length) {
    const n = q.pop(), i = n % C, j = n / C | 0;
    for (let d = 0; d < 4; d++) {
      if (!edgeAt(i, j, d)) continue;
      const ni = i + DX[d], nj = j + DY[d], m = nj * C + ni;
      if (seen[m]) continue;
      const ok = mode === 0 ? true : mode === 1 ? canTravel(i, j, d) : canTravel(ni, nj, (d + 2) % 4);
      if (ok) { seen[m] = 1; c++; q.push(m); }
    }
  }
  return c === N;
}
const connected = () => bfsAll(0), strong = () => bfsAll(1) && bfsAll(2);
function distFrom(i0, j0) {
  const N = C * Rr, dist = new Int16Array(N).fill(-1), q = [j0 * C + i0]; dist[q[0]] = 0; let h = 0;
  while (h < q.length) {
    const n = q[h++], i = n % C, j = n / C | 0;
    for (let d = 0; d < 4; d++) { if (!canTravel(i, j, d)) continue; const m = (j + DY[d]) * C + i + DX[d]; if (dist[m] < 0) { dist[m] = dist[n] + 1; q.push(m); } }
  }
  return dist;
}
function edgeDist(dist, e) {
  const a = e.j * C + e.i, b = e.h ? a + 1 : a + C; let best = 1e9;
  if (dist[a] >= 0) best = Math.min(best, dist[a]); if (dist[b] >= 0) best = Math.min(best, dist[b]);
  return best + 0.5;
}
const ends = e => e.h ? [e.i, e.j, e.i + 1, e.j] : [e.i, e.j, e.i, e.j + 1];
const midOf = e => e.h ? [e.i + 0.5, e.j] : [e.i, e.j + 0.5];
const streetOf = e => e.h ? rowNames[e.j] : colNames[e.i];

function genMap(st) {
  C = st.c; Rr = st.r; edges = new Map();
  for (let j = 0; j < Rr; j++) for (let i = 0; i < C; i++) { if (i < C - 1) addEdge(true, i, j); if (j < Rr - 1) addEdge(false, i, j); }
  const list = shuffle([...edges.values()]); const target = Math.floor(list.length * st.cut); let rem = 0;
  for (const e of list) { if (rem >= target) break; edges.delete(e.k); if (connected()) rem++; else edges.set(e.k, e); }
  if (st.ow > 0) {
    const l2 = shuffle([...edges.values()]); const tgt = Math.floor(l2.length * st.ow); let n = 0;
    for (const e of l2) { if (n >= tgt) break; e.ow = Math.random() < 0.5 ? 1 : -1; if (strong()) n++; else e.ow = 0; }
  }
  cells = [];
  for (let j = 0; j < Rr - 1; j++) { const row = []; for (let i = 0; i < C - 1; i++) row.push({ t: Math.random() < 0.13 ? 'park' : 'bld', v: Math.random() * 3 | 0, s: Math.random() }); cells.push(row); }
  rowNames = shuffle(STREETS_H.slice()); colNames = shuffle(STREETS_V.slice());
  layout();
}

// ---------------- game state ----------------
let state = 'menu', paused = false, t = 0, money = 0, best = +(load('nav_best') || 0), delivered = 0, stageIdx = 0;
let timeLeft = 0, edgeTime = 1.45, queue = [], car = null, dest = null, trip = null;
let msg = { icon: NAVI, text: '', t: -9 }, navLine = '', floats = [], fx = [], banner = null, closeT = 0, lastPass = null;
let fineFlash = 0, overT = 0, newBest = false, lowWarned = false, pressed = {};

function say(icon, text) { msg = { icon, text, t }; }
const angOf = d => Math.atan2(DY[d], DX[d]);
function floatAtCar(text, color) { floats.push({ x: sx(car.x), y: sy(car.y) - RW, text, color, age: 0 }); }

function setLeg(i, j, nd) {
  const e = edgeAt(i, j, nd);
  car.d = nd; car.fi = i; car.fj = j; car.ek = e.k;
  if (e.closed) { car.tx = i + DX[nd] * 0.34; car.ty = j + DY[nd] * 0.34; car.toNode = false; }
  else { car.tx = i + DX[nd]; car.ty = j + DY[nd]; car.toNode = true; if (wrongWay(e, nd)) fine(); }
}
function placeCar() {
  const nodes = shuffle([...Array(C * Rr).keys()]);
  for (const n of nodes) {
    const i = n % C, j = n / C | 0, ds = shuffle([0, 1, 2, 3]).filter(d => canTravel(i, j, d));
    if (ds.length) { car = { x: i, y: j, d: ds[0], ang: angOf(ds[0]), wait: false }; setLeg(i, j, ds[0]); return; }
  }
}
function fwdOpts(i, j, d) { return [d, (d + 3) % 4, (d + 1) % 4].filter(k => !!edgeAt(i, j, k)); }
const wantDir = (cmd, d) => cmd === 'L' ? (d + 3) % 4 : cmd === 'R' ? (d + 1) % 4 : cmd === 'U' ? (d + 2) % 4 : d;
function decide(i, j, d, cmd) {
  if (cmd === 'U') return { nd: (d + 2) % 4, used: true, ev: 'uturn', dec: true };
  const o = fwdOpts(i, j, d);
  if (!o.length) return { nd: (d + 2) % 4, used: false, ev: 'dead' };
  if (o.length === 1) return { nd: o[0], used: false };
  if (cmd) {
    const w = wantDir(cmd, d);
    if (o.includes(w)) return { nd: w, used: true, dec: true };
    if (o.includes(d)) return { nd: d, used: true, ev: 'invalid', dec: true };
    return { wait: true, used: true, ev: 'invalid', dec: true };
  }
  if (o.includes(d)) return { nd: d, used: false, dec: true, ev: 'default', opts: o };
  return { wait: true, used: false, dec: true };
}

function arriveNode() {
  const i = Math.round(car.tx), j = Math.round(car.ty); car.x = i; car.y = j;
  const cmd = queue[0], r = decide(i, j, car.d, cmd);
  if (r.used) queue.shift();
  if (r.wait) {
    car.wait = true; car.wi = i; car.wj = j;
    if (r.ev === 'invalid') { say(DRIVER, fill(pick(L_INVALID), { d: DIR_WORD[cmd] }).replace(', еду прямо', '') + ' Куда?'); sfxBad(); }
    else { say(DRIVER, pick(L_WAIT)); sfxAsk(); }
    refreshNav(false); return;
  }
  if (r.ev === 'invalid') { say(DRIVER, fill(pick(L_INVALID), { d: DIR_WORD[cmd] })); sfxBad(); }
  else if (r.ev === 'uturn') say(DRIVER, pick(L_UTURN));
  else if (r.ev === 'dead') { say(DRIVER, pick(L_DEAD)); sfxBad(); }
  lastPass = r.ev === 'default' ? { t, d: car.d, opts: r.opts, went: r.nd } : null;
  setLeg(i, j, r.nd);
  if (r.used) refreshNav(false);
}
function arriveBarrier() {
  car.d = (car.d + 2) % 4; car.tx = car.fi; car.ty = car.fj; car.toNode = true;
  say(DRIVER, pick(L_BARRIER)); sfxBad();
}
function fine() {
  money = Math.max(0, money - 300); timeLeft -= 4; fineFlash = 1.4;
  say(DRIVER, pick(L_WRONG)); floatAtCar('штраф −300 ₽ · −4 с', '#ff6b7d'); sfxSiren();
}

// ---------------- route preview ----------------
function simulate() {
  const pts = [[car.x, car.y]], marks = [];
  if (car.wait) { marks.push({ x: car.wi, y: car.wj, wait: true, idx: -1 }); return { pts, marks }; }
  const q = queue.slice(); let used = 0, dist = 0;
  const s = { x: car.x, y: car.y, d: car.d, tx: car.tx, ty: car.ty, toNode: car.toNode, fi: car.fi, fj: car.fj };
  for (let n = 0; n < 16; n++) {
    dist += Math.hypot(s.tx - s.x, s.ty - s.y); s.x = s.tx; s.y = s.ty; pts.push([s.x, s.y]);
    if (!s.toNode) { s.d = (s.d + 2) % 4; s.tx = s.fi; s.ty = s.fj; s.toNode = true; marks.push({ x: s.x, y: s.y, barrier: true, idx: -1 }); continue; }
    const i = Math.round(s.x), j = Math.round(s.y), cmd = q[0], r = decide(i, j, s.d, cmd);
    if (r.used) { marks.push({ x: i, y: j, idx: used, cmd, dist, nd: r.nd, bad: r.ev === 'invalid', wait: !!r.wait }); q.shift(); used++; }
    else if (r.dec) marks.push({ x: i, y: j, idx: -1, dist, nd: r.nd, wait: !!r.wait, def: true });
    else if (r.ev === 'dead') marks.push({ x: i, y: j, idx: -1, dead: true });
    if (r.wait) break;
    const e = edgeAt(i, j, r.nd); s.d = r.nd; s.fi = i; s.fj = j;
    if (e.closed) { s.tx = i + DX[r.nd] * 0.34; s.ty = j + DY[r.nd] * 0.34; s.toNode = false; }
    else { s.tx = i + DX[r.nd]; s.ty = j + DY[r.nd]; s.toNode = true; }
    if (!q.length && r.dec && !r.used) { pts.push([s.x + (s.tx - s.x) * 0.6, s.y + (s.ty - s.y) * 0.6]); break; }
  }
  return { pts, marks };
}
function phraseFor(k, sim) {
  const m = sim.marks.find(mk => mk.idx === k);
  const cmd = queue[k], txt = CMD_TXT[cmd];
  if (!m) return 'Затем ' + txt;
  const prev = k > 0 ? sim.marks.find(mk => mk.idx === k - 1) : null;
  const d = m.dist - (prev ? prev.dist : 0), meters = Math.round(d * 2) * 50;
  if (k === 0) return meters < 50 ? 'Сейчас ' + txt : 'Через ' + meters + ' метров ' + txt;
  return meters < 50 ? 'Сразу ' + txt : 'Затем через ' + meters + ' метров ' + txt;
}
function refreshNav(speakIt) {
  if (car.wait) { navLine = 'Водитель ждёт команду'; return; }
  if (!queue.length) { navLine = 'Едем прямо по дороге'; return; }
  const sim = simulate(), k = queue.length - 1, p = phraseFor(k, sim);
  navLine = p.charAt(0).toUpperCase() + p.slice(1);
  if (speakIt) speak(navLine);
}

// ---------------- commands ----------------
function command(cmd) {
  if (state !== 'play' || paused || banner) return;
  unlock();
  if (car.wait) {
    const r = decide(car.wi, car.wj, car.d, cmd);
    if (r.wait) { say(DRIVER, DIR_WORD[cmd] + ' не могу, там нет дороги. Куда?'); sfxBad(); return; }

    ctx.fillStyle = pr ? '#38d1ff' : b.c === 'X' ? '#2a2233' : '#222c45'; rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
    txt(b.g, b.x + b.w / 2, b.y + b.h * 0.4, 24, pr ? '#0b1020' : '#e8ecff', 700);
    txt(b.l, b.x + b.w / 2, b.y + b.h * 0.78, 10, pr ? '#0b1020' : '#8592ba', 600);
  }
}
function overlay(a) { ctx.fillStyle = 'rgba(6,9,18,' + a + ')'; ctx.fillRect(0, 0, W, H); }
function drawCard(lines, y) {
  // lines: [text,size,color,weight]
  let h = 28; for (const l of lines) h += l[1] * 1.45;
  const w = Math.min(W - 32, 360), x = W / 2 - w / 2;
  ctx.fillStyle = '#141b2d'; rr(x, y - h / 2, w, h, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(56,209,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
  let cy = y - h / 2 + 14;
  for (const l of lines) { cy += l[1] * 0.725; txt(l[0], W / 2, cy, l[1], l[2], l[3], 'center', l[4]); cy += l[1] * 0.725; }
}
function drawBanner() {
  overlay(0.6);
  const hint = wrap(banner.hint, Math.min(W - 32, 360) - 36, 14, 500);
  const lines = [[banner.title.toUpperCase(), 12, '#38d1ff', 800], [banner.name, 30, '#ffffff', 900], ['', 6, '#fff', 400]];
  for (const h of hint) lines.push([h, 14, '#c9d2f0', 500]);
  lines.push(['', 8, '#fff', 400]);
  lines.push(['Коснитесь, чтобы ехать', 15, '#38d1ff', 700, 0.55 + 0.45 * Math.sin(t * 4)]);
  drawCard(lines, H / 2);
}
function drawMenu() {
  overlay(0.86);
  const top = SAFE_T + Math.max(40, H * 0.1);
  txt('НАВИГАТОР', W / 2, top, Math.min(46, W * 0.11), '#ffffff', 900);
  txt('Вы — голос в навигаторе.', W / 2, top + 44, 16, '#c9d2f0', 600);
  txt('Водитель делает ровно то, что вы скажете.', W / 2, top + 66, 14, '#8592ba', 500);
  const rows = [
    ['🚕', 'Машина едет сама. Доставьте пассажира к метке 📍'],
    ['👆', 'Свайп ← → — налево / направо, ↑ — прямо, ↓ — разворот'],
    ['🧭', 'Команды выполняются на ближайших перекрёстках, по очереди (до 3)'],
    ['⏱', 'Опоздали с командой — водитель проедет поворот'],
    ['💰', 'Быстро довезли — чаевые. Время кончилось — смена окончена'],
  ];
  let y = top + 112; const w = Math.min(W - 40, 360), x = W / 2 - w / 2;
  for (const [ic, s] of rows) {
    const ls = wrap(s, w - 44, 14, 500);
    txt(ic, x + 14, y + (ls.length - 1) * 9, 20, '#fff', 400);
    ls.forEach((ln, k) => txt(ln, x + 40, y + k * 18, 14, '#dfe5ff', 500, 'left'));
    y += ls.length * 18 + 16;
  }
  if (best > 0) txt('Рекорд: ' + fmtMoney(best) + ' ₽', W / 2, y + 14, 15, '#ffd84d', 700);
  txt('Коснитесь, чтобы начать смену', W / 2, Math.min(H - SAFE_B - 50, y + 64), 19, '#38d1ff', 800, 'center', 0.55 + 0.45 * Math.sin(t * 4));
}
function drawOver() {
  overlay(0.7);
  const lines = [
    ['СМЕНА ОКОНЧЕНА', 13, '#ff8a9a', 800], ['', 4, '#fff', 400],
    [fmtMoney(money) + ' ₽', 40, '#ffffff', 900],
    ['Пассажиров: ' + delivered + ' · район: ' + STAGES[stageIdx].name, 13, '#8592ba', 600], ['', 6, '#fff', 400],
    [newBest ? '🏆 Новый рекорд!' : 'Рекорд: ' + fmtMoney(best) + ' ₽', 17, '#ffd84d', 800], ['', 8, '#fff', 400],
  ];
  if (t - overT > 0.8) lines.push(['Коснитесь — новая смена', 16, '#38d1ff', 700, 0.55 + 0.45 * Math.sin(t * 4)]);
  else lines.push([' ', 16, '#38d1ff', 700]);
  drawCard(lines, H / 2);
}
function draw() {
  ctx.fillStyle = '#0e1320'; ctx.fillRect(0, 0, W, H);
  if (edges.size) { drawMap(); if (state !== 'menu') { drawPreview(); drawDest(); } drawCar(); drawFx(); }
  if (state === 'menu') { drawMenu(); return; }
  drawTop(); drawBottom();
  if (banner) drawBanner();
  else if (state === 'over') drawOver();
  else if (paused) drawCard([['Пауза', 26, '#fff', 800], ['Коснитесь, чтобы продолжить', 14, '#c9d2f0', 500]], H / 2);
}

// ---------------- input ----------------
let ptr = null;
function pressBtn(b) {
  pressed[b.c] = 0.15;
  if (b.c === 'X') cancelCmd(); else command(b.c);
}
window.addEventListener('pointerdown', e => {
  if (e.target === sndBtn) return;
  e.preventDefault(); unlock();
  if (state === 'play' && !paused && !banner) { const b = hitBtn(e.clientX, e.clientY); if (b) { pressBtn(b); ptr = null; return; } }
  ptr = { x: e.clientX, y: e.clientY };
}, { passive: false });
window.addEventListener('pointerup', e => {
  if (!ptr) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y; ptr = null;
  if (state === 'menu') { start(); return; }
  if (state === 'over') { if (t - overT > 0.8) start(); return; }
  if (banner) { banner = null; return; }
  if (paused) { paused = false; return; }
  if (Math.hypot(dx, dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) command(dx < 0 ? 'L' : 'R'); else command(dy < 0 ? 'S' : 'U');
});
window.addEventListener('pointercancel', () => { ptr = null; });
window.addEventListener('touchend', unlock, { passive: true });
window.addEventListener('keydown', e => {
  const map = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'S', ArrowDown: 'U' };
  if (map[e.key]) { e.preventDefault(); pressed[map[e.key]] = 0.15; command(map[e.key]); return; }
  if (e.key === 'Backspace') { e.preventDefault(); pressed.X = 0.15; cancelCmd(); return; }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (state === 'menu' || (state === 'over' && t - overT > 0.8)) start(); else if (banner) banner = null; else if (paused) paused = false;
  }
});
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; last = performance.now(); });
window.addEventListener('blur', () => { if (state === 'play') paused = true; });
window.addEventListener('resize', resize);

// test hook (read-only snapshot + command)
window.__nav = {
  snap: () => ({ state, banner: !!banner, paused, car: car && { ...car }, dest: dest && { k: dest.e.k, x: dest.x, y: dest.y },
    queue: queue.slice(), C, Rr, delivered, stageIdx, money, timeLeft,
    edges: [...edges.values()].map(e => ({ k: e.k, h: e.h, i: e.i, j: e.j, ow: e.ow, closed: e.closed })) }),
  command, start, dismiss: () => { banner = null; },
};

// ---------------- loop ----------------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  update(dt); draw();
  requestAnimationFrame(frame);
}
resize(); genMap(STAGES[1]); placeCar();
requestAnimationFrame(frame);
})();
</script>
</body>
